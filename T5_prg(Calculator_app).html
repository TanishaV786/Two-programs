<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIY-5</title>
    <link rel="stylesheet" href="./CSS/T5_prg(Calculator_app).css">
</head>
<body>

    <iv class="calculator">

        <h2>Calculator</h2>

        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">

        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button>
            <button onclick="calculate('*')">*</button>
            <button onclick="calculate('/')">÷</button>
            <button onclick="calculate('%')">%</button>
        </div>

        <input type="text" id="answer" placeholder="Answer" readonly>

        <a href="https://github.com/TanishaV786/Two-programs/blob/main/T5_prg(Calculator_app).html" target="_blank" class="github-link">View on GitHub</a>

    </div>

    <script src="./JS/T5_prg(Calculator_app).js"></script>
    
</body>
</html>
